name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed only for the optional "release" job below

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (pure-Kotlin sim core)
        run: ./gradlew --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: oersted-737-line-lab-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Publishes the APK as a GitHub Release when you push a tag like v0.1.0
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: oersted-737-line-lab-debug-apk
          path: apk
      - uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
